spring:
  datasource:
    url: jdbc:h2:mem:razzieAwardsApiTestDB;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always

app:
  csv:
    file-name: Movielist.csv
