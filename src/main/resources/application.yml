spring:
  datasource:
    url: jdbc:h2:mem:razzieAwardsApiDB;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always
      continue-on-error: false
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always

server:
  tomcat:
    threads:
      max: 50
  virtual-threads:
    enabled: true

  management:
    tracing:
      sampling:
        probability: 1.0

  logging:
    level:
        org.springframework.batch: DEBUG
        org.springframework.jdbc: DEBUG
    pattern:
      console: >
        %d{yyyy-MM-dd HH:mm:ss}
        [%thread]
        %-5level
        [%X{traceId:-},%X{spanId:-}]
        %logger{36}
        - %msg%n

kind: Application

app:
  csv:
    file-name: Movielist.csv
